<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#ffb347" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Cooking</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0;
        background: #f8ddae;
        /* No pull-to-refresh, scrolling, zoom, callouts, selection or tap flashes. */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game, canvas { width: 100%; height: 100%; touch-action: none; outline: none; }
      /* Rotate screen (no text): shown over the game while the screen is portrait. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #fff6e6; align-items: center; justify-content: center; }
      #rotate.show { display: flex; }
      #rotate svg { width: min(70vw, 60vh); height: auto; }
      #rotate .phone { transform-origin: 150px 150px; animation: turn 2.4s ease-in-out infinite; }
      #rotate .arrow { transform-origin: 150px 150px; animation: nudge 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 20% { transform: rotate(0deg); } 55%, 85% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
      @keyframes nudge { 0%, 20% { opacity: 0.35; } 40%, 70% { opacity: 1; } 100% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-hidden="true">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" stroke="#5B3A29" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
        <g class="arrow" fill="none">
          <path d="M 62 92 A 110 110 0 0 1 208 62" stroke="#F79A3E" stroke-width="16" />
          <path d="M 196 34 L 214 64 L 180 74" stroke="#F79A3E" stroke-width="16" />
        </g>
        <g class="phone">
          <rect x="105" y="60" width="90" height="180" rx="18" fill="#FFCB47" />
          <rect x="117" y="80" width="66" height="130" rx="6" fill="#FFF6E6" stroke-width="6" />
          <circle cx="150" cy="224" r="6" fill="#5B3A29" stroke="none" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
