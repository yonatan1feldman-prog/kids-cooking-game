<!doctype html><html><head><meta charset="utf-8"><title>items compare</title>
<style>body{margin:0;background:#F3E4C6}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
// items-compare.html?mode=scene|old  — in-context check for gen_items.py (game path: img -> canvas).
const q = new URLSearchParams(location.search), mode = q.get("mode") || "scene";
const T = ["topping-tomato","topping-olive","topping-mushroom","topping-corn","topping-pepper","topping-onion"];
const names = ["tray","dough-flat","sauce-blob","cheese-shred","topping-bin",...T,"dough-ball","rolling-pin","sauce-bowl","cheese-shaker","pizza-slice"];
const load = (src) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src + "?" + Date.now(); });
const ras = (i) => { const t = document.createElement("canvas"); t.width = i.naturalWidth; t.height = i.naturalHeight; t.getContext("2d").drawImage(i, 0, 0); return t; };
Promise.all(names.map(n => load("../" + n + ".svg"))).then(async imgs => {
  const I = {}; names.forEach((n, k) => I[n] = imgs[k] && ras(imgs[k]));
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  if (mode === "old") {
    const olds = await Promise.all(names.map(n => load("../../images/" + n + ".svg")));
    cv.width = 1800; cv.height = 700; g.fillStyle = "#F3E4C6"; g.fillRect(0, 0, 1800, 700);
    let x = 10; const s = .4;
    names.forEach((n, k) => {
      const nw = I[n], o = olds[k]; if (!nw) return;
      const w = nw.width * s, h = nw.height * s;
      if (x + w > 1790) { x = 10; g.translate(0, 340); }
      if (o) g.drawImage(o, x, 10, w, h);
      g.drawImage(nw, x, 20 + h, w, h);
      g.strokeStyle = "rgba(0,0,255,.35)"; g.strokeRect(x, 10, w, h); g.strokeRect(x, 20 + h, w, h);
      x += w + 12;
    });
    document.title = "DONE"; return;
  }
  // scene: wall + counter, pizza at game-ish scale k, bins row, phone-size toppings
  const W = 1800, H = 1000; cv.width = W; cv.height = H;
  g.fillStyle = "#F3E4C6"; g.fillRect(0, 0, W, H); g.fillStyle = "#D8AB7C"; g.fillRect(0, 380, W, H);
  const k = .6, px = 40, py = 60;
  g.drawImage(I.tray, px, py, 820 * k, 830 * k);
  const dx = px + (410 - 360) * k, dy = py + (410 - 356) * k;
  g.drawImage(I["dough-flat"], dx, dy, 720 * k, 720 * k);
  // sauce brush (recoloured silhouette), stamped over the left half
  const b = document.createElement("canvas"); b.width = 200; b.height = 200; const bg = b.getContext("2d");
  bg.drawImage(I["sauce-blob"], 0, 0); bg.globalCompositeOperation = "source-in"; bg.fillStyle = "#E4523B"; bg.fillRect(0, 0, 200, 200);
  const cx = dx + 360 * k, cy = dy + 356 * k;
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) { const a = rnd() * 6.28, d = Math.sqrt(rnd()) * 230 * k; g.drawImage(b, cx + Math.cos(a) * d - 60 * k, cy + Math.sin(a) * d - 60 * k, 120 * k, 120 * k); }
  // cheese on the lower half
  for (let i = 0; i < 90; i++) { const a = rnd() * 3.14, d = Math.sqrt(rnd()) * 250 * k; g.save(); g.translate(cx + Math.cos(a) * d, cy + Math.sin(a) * d); g.rotate(rnd() * 6); g.drawImage(I["cheese-shred"], -40 * k, -22 * k, 80 * k, 44 * k); g.restore(); }
  // toppings: ring on sauce (upper half) and on cheese (lower half)
  T.forEach((t, j) => {
    for (const [a, d] of [[-2.8 + j * .45, 150], [.3 + j * .45, 170]]) g.drawImage(I[t], cx + Math.cos(a) * d * k - 70 * k, cy + Math.sin(a) * d * k - 70 * k, 140 * k, 140 * k);
  });
  // bins (scale k) with a topping in each, on the counter
  T.forEach((t, j) => {
    const bx = 560 + j * 150, by = 400;
    g.drawImage(I["topping-bin"], bx, by, 240 * k, 240 * k);
    g.drawImage(I[t], bx + (120 - 70) * k, by + (112 - 70) * k, 140 * k, 140 * k);
  });
  // phone-size check: toppings at 0.4 on sauce, cheese, bin floor
  const rows = [["#E4523B", 0], ["#FFD152", 1], ["#D3E8DF", 2]];
  rows.forEach(([col, r]) => { g.fillStyle = col; g.fillRect(560, 600 + r * 70, 560, 64); T.forEach((t, j) => g.drawImage(I[t], 570 + j * 90, 604 + r * 70, 56, 56)); });
  // other items on the wall/counter at k
  g.drawImage(I["dough-ball"], 1480, 60, 360 * k * .8, 300 * k * .8);
  g.drawImage(I["rolling-pin"], 1180, 250, 640 * k * .8, 200 * k * .8);
  g.drawImage(I["sauce-bowl"], 1200, 60, 340 * k * .8, 300 * k * .8);
  g.drawImage(I["cheese-shaker"], 1600, 600, 260 * k, 400 * k);
  g.drawImage(I["pizza-slice"], 1200, 600, 300 * k, 300 * k);
  // rolling pin at 1/3
  g.drawImage(I["rolling-pin"], 1200, 820, 640 / 3, 200 / 3);
  document.title = "DONE";
});
</script></body></html>
